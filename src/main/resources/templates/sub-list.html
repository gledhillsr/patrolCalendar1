<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title th:text="'Substitute List for ' + ${resortFullName}">Substitute List</title>
    <style type="text/css">
        body {
            font-size: 10pt;
            color: #000000;
            background-color: #ffffff;
        }
    </style>
</head>
<body topmargin="0" leftmargin="0" style="background-image: url(/calendar-1/images/ncmnthbk.jpg)">
    <div th:replace="~{fragments/header :: header(resort=${resort}, resortFullName=${resortFullName}, patrollerId=${patrollerId})}"></div>

    <p><center><h2 th:text="'Substitute List for ' + ${resortFullName}">Substitute List</h2></center></p>

    <!-- Email button -->
    <p th:if="${!substitutes.isEmpty()}">
        <b>
            <input type="button"
                   value="e-mail THESE patrollers"
                   th:data-url="${emailFormUrl}"
                   onclick="window.location=this.getAttribute('data-url')"/>
        </b>
    </p>

    <!-- Substitute table -->
    <table style="font-size: 10pt; font-family: Verdana, Arial, Helvetica;" border="1" width="100%" bordercolordark="#003366" bordercolorlight="#C0C0C0">
        <tr>
            <td width="148" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Name</font></font></td>
            <td width="90" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Home</font></font></td>
            <td width="83" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Work</font></font></td>
            <td width="70" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Cell</font></font></td>
            <td width="136" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Email</font></font></td>
        </tr>

        <!-- Empty state message -->
        <tr th:if="${substitutes.isEmpty()}">
            <td colspan="5" style="text-align: center; padding: 20px;">
                No substitutes currently available
            </td>
        </tr>

        <!-- Substitute rows -->
        <tr th:each="sub : ${substitutes}">
            <td th:text="${sub.name}">Name</td>
            <td th:text="${sub.homePhone != null and sub.homePhone != '' ? sub.homePhone : ''}">Home</td>
            <td th:text="${sub.workPhone != null and sub.workPhone != '' ? sub.workPhone : ''}">Work</td>
            <td th:text="${sub.cellPhone != null and sub.cellPhone != '' ? sub.cellPhone : ''}">Cell</td>
            <td>
                <a th:if="${sub.email != null and sub.email != ''}"
                   th:href="'mailto:' + ${sub.email}"
                   th:text="${sub.email}">email</a>
            </td>
        </tr>
    </table>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
