<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
      Common <head> contents: charset, viewport and the shared stylesheet.

      Use it from a page like this, keeping any page-specific <script> or <style>
      after the block:

        <head>
            <th:block th:replace="~{fragments/head :: pageHead('Email Composition - ' + ${resortFullName})}"></th:block>
            <style> ...page-specific rules... </style>
        </head>
    -->
    <th:block th:fragment="pageHead(pageTitle)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="-1">
        <title th:text="${pageTitle}">Patrol Calendar</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}"/>
        <th:block th:replace="~{fragments/head :: icons}"></th:block>
    </th:block>

    <!--
      Browser icon. Its own fragment so the handful of pages that build their own <head>
      instead of calling pageHead can pull in just this bit.

      Two formats on purpose: the SVG is one small file that stays sharp at any size, but
      Safari does not render SVG favicons, so the PNG is what it falls back to. @{/...}
      prefixes the /calendar-1 context path.
    -->
    <th:block th:fragment="icons">
        <link rel="icon" type="image/svg+xml" th:href="@{/Injury_icon.svg}"/>
        <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32.png}"/>
        <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}"/>
    </th:block>
</head>
<body>
</body>
</html>
