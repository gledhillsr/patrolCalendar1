<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        #banner {
            background: white;
            border-bottom: 3px solid #003366;
            font-family: Arial, Helvetica, sans-serif;
        }
        .banner-top {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 16px;
        }
        .banner-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #003366;
            margin: 0;
            flex: 1;
        }
        .nav-public {
            background: #eeeeee;
            padding: 5px 14px;
            border-top: 1px solid #cccccc;
        }
        .nav-members {
            background: #003366;
            padding: 5px 14px;
        }
        .nav-label {
            color: rgba(255,255,255,0.85);
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 6px;
        }
        .nav-btn {
            display: inline-block;
            padding: 3px 10px;
            margin: 2px 2px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: bold;
        }
        .nav-public .nav-btn {
            background: white;
            color: #003366;
            border: 1px solid #aaaaaa;
        }
        .nav-public .nav-btn:hover {
            background: #003366;
            color: white;
            border-color: #003366;
        }
        .nav-members .nav-btn {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .nav-members .nav-btn:hover {
            background: white;
            color: #003366;
        }
        .nav-btn-logout {
            margin-left: 16px;
            background: rgba(255,255,255,0.22) !important;
            border-color: rgba(255,255,255,0.5) !important;
        }
    </style>
</head>
<body>
    <div th:fragment="header(resort, resortFullName, patrollerId)">
        <link rel="stylesheet" th:href="@{/css/header.css}"/>
        <div th:if="${resort == 'Brighton'}" th:remove="tag">
            <div th:replace="~{fragments/header :: brighton-header(${resort}, ${resortFullName}, ${patrollerId})}"></div>
        </div>
        <div th:unless="${resort == 'Brighton'}" th:remove="tag">
            <div th:replace="~{fragments/header :: standard-header(${resort}, ${resortFullName}, ${patrollerId})}"></div>
        </div>
    </div>

    <!-- Brighton-specific header -->
    <div th:fragment="brighton-header(resort, resortFullName, patrollerId)"
         th:with="pid=${patrollerId != null ? patrollerId : ''}" th:remove="tag">
        <div id="banner">
            <div class="banner-top">
                <a href="https://www.brightonresort.com">
                    <img src="/calendar-1/images/Brighton.gif" width="261" height="60" border="0" alt="Brighton Ski Resort"/>
                </a>
                <h1 class="banner-title">
                    Brighton Ski Patrol
                    <img src="/calendar-1/images/cadeuc4.gif" width="28" height="28" border="0" alt="NSP"
                         style="vertical-align: middle; margin-left: 8px;"/>
                </h1>
            </div>

            <div class="nav-public">
                <a class="nav-btn" href="/Brighton/Volunteer.htm">Volunteer Application</a>
                <a class="nav-btn" target="_blank" href="http://ccweather.com/w/index.php">Weather</a>
            </div>

            <div class="nav-members">
                <span class="nav-label">(Members Only):</span>
                <a class="nav-btn" target="_self" th:href="@{/MonthCalendar(resort=${resort}, ID=${pid})}">Online Schedule</a>
                <a class="nav-btn" target="_self" th:href="@{/ListAssignments(resort=${resort}, ID=${pid})}">My Assignments</a>
                <a class="nav-btn" target="_self" th:href="@{/SubList(resort=${resort}, ID=${pid})}">Sub List</a>
                <a class="nav-btn" target="_self" th:href="@{/UpdateInfo(resort=${resort}, ID=${pid})}">My Info</a>
                <a class="nav-btn" target="_self" th:href="@{/MemberList(resort=${resort}, ID=${pid})}">Patrollers</a>
                <a class="nav-btn" target="_self" th:href="@{/Directors(resort=${resort}, ID=${pid})}">Directors</a>
                <a class="nav-btn" target="_self" th:href="@{/RefresherTraining(resort=${resort}, ID=${pid})}">Refresher/Training</a>
                <a th:if="${pid != null and pid != ''}" class="nav-btn nav-btn-logout"
                   target="_self" th:href="@{/MemberLogout(resort=${resort})}">Logout</a>
            </div>
        </div>
    </div>

    <!-- Standard header for non-Brighton resorts -->
    <div th:fragment="standard-header(resort, resortFullName, patrollerId)"
         th:with="pid=${patrollerId != null ? patrollerId : ''}" th:remove="tag">
        <div id="banner">
            <div class="banner-top">
                <a th:href="${resortUrl}">
                    <img border="0" th:src="${resortImage}" th:height="${resortImgHeight}" th:alt="${resortFullName}"/>
                </a>
                <h1 class="banner-title">
                    <span th:text="${resortFullName}">Resort</span> Ski Patrol
                    <img src="/calendar-1/images/cadeuc4.gif" width="28" height="28" border="0" alt="NSP"
                         style="vertical-align: middle; margin-left: 8px;"/>
                </h1>
            </div>

            <div class="nav-members">
                <a class="nav-btn" target="_self" th:href="@{/MonthCalendar(resort=${resort}, ID=${pid})}">Online Schedule</a>
                <a class="nav-btn" target="_self" th:href="@{/ListAssignments(resort=${resort}, ID=${pid})}">My Assignments</a>
                <a class="nav-btn" target="_self" th:href="@{/SubList(resort=${resort}, ID=${pid})}">Sub List</a>
                <a class="nav-btn" target="_self" th:href="@{/UpdateInfo(resort=${resort}, ID=${pid})}">My Info</a>
                <a class="nav-btn" target="_self" th:href="@{/MemberList(resort=${resort}, ID=${pid})}">Patrollers</a>
                <a class="nav-btn" target="_self" th:href="@{/Directors(resort=${resort}, ID=${pid})}">Directors</a>
                <a th:if="${pid != null and pid != ''}" class="nav-btn nav-btn-logout"
                   target="_self" th:href="@{/MemberLogout(resort=${resort})}">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
