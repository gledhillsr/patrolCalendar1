<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        #banner {
            background: white;
            border-bottom: 3px solid #003366;
            font-family: Arial, Helvetica, sans-serif;
        }
        .banner-top {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            padding: 10px 16px;
            gap: 16px;
        }
        .banner-title {
            font-size: 3em;
            font-weight: bold;
            color: #003366;
            margin: 0;
            min-width: 0;
            overflow: hidden;
        }
        .banner-title-text {
            display: block;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .banner-beta {
            font-size: 0.4em;
            font-weight: normal;
            font-style: italic;
            color: #b91c1c;
            vertical-align: middle;
        }
        .nav-public {
            background: #eeeeee;
            padding: 5px 14px;
            border-top: 1px solid #cccccc;
        }
        .nav-members {
            background: #003366;
            padding: 5px 14px;
        }
        .nav-label {
            color: rgba(255,255,255,0.85);
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 6px;
        }
        .nav-btn {
            display: inline-block;
            padding: 3px 10px;
            margin: 2px 2px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: bold;
        }
        .nav-public .nav-btn {
            background: white;
            color: #003366;
            border: 1px solid #aaaaaa;
        }
        .nav-public .nav-btn:hover {
            background: #003366;
            color: white;
            border-color: #003366;
        }
        .nav-members .nav-btn {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .nav-members .nav-btn:hover {
            background: white;
            color: #003366;
        }
        .nav-btn-logout {
            margin-left: 16px;
            background: rgba(255,255,255,0.22) !important;
            border-color: rgba(255,255,255,0.5) !important;
        }
    </style>
</head>
<body>
    <!--
      One header for every resort.

      Brighton used to have its own copy, because it hardcoded a logo, a title and three extra
      buttons. The logo and title were already in ResortData - identical values - and the buttons
      now live in the menubuttons table (Directors -> Menu Configuration), so there is nothing
      resort-specific left to fork over.
    -->
    <div th:fragment="header(resort, resortFullName, patrollerId)">
        <link rel="stylesheet" th:href="@{/css/header.css}"/>
        <div th:replace="~{fragments/header :: banner(${resort}, ${resortFullName}, ${patrollerId})}"></div>
    </div>

    <div th:fragment="banner(resort, resortFullName, patrollerId)"
         th:with="pid=${patrollerId != null ? patrollerId : ''},
                  menu=${@menuButtonService.forHeader(resort, patrollerId)}"
         th:remove="tag">
        <div id="banner">
            <div class="banner-top">
                <a th:href="${resortUrl}">
                    <img border="0" th:src="${resortImage}" th:height="${resortImgHeight}"
                         th:alt="${resortFullName}"/>
                </a>
                <h1 class="banner-title"><span class="banner-title-text"
                    th:text="${resortFullName} + ' Ski Patrol'">Resort Ski Patrol</span></h1>
                <img class="banner-icon" src="/calendar-1/images/cadeuc4.gif" width="56" height="56"
                     border="0" alt="NSP"/>
            </div>

            <!-- Two domains point here; a visitor who came in on the second one is told so,
                 and on the primary domain this is absent. See SiteIdentity. -->
            <div class="nav-welcome" th:if="${@site.isPatrolCalendarHost()}"
                 th:text="'Welcome to ' + ${@site.patrolCalendarDisplay}">Welcome</div>

            <!-- Public custom buttons. Drawn only when this resort has configured one, so nobody
                 gets an empty grey strip. -->
            <div class="nav-public" th:if="${!menu.publicButtons.isEmpty()}">
                <a th:each="button : ${menu.publicButtons}" class="nav-btn"
                   th:href="${button.url}" th:text="${button.text}"
                   th:target="${button.url.startsWith('/') ? '_self' : '_blank'}">Button</a>
            </div>

            <div class="nav-members">
                <span class="nav-label">(Members Only):</span>
                <a class="nav-btn" target="_self" th:href="@{/MonthCalendar(resort=${resort}, ID=${pid})}">Calendar</a>
                <a class="nav-btn" target="_self" th:href="@{/ListAssignments(resort=${resort}, ID=${pid})}">My Assignments</a>
                <a class="nav-btn" target="_self" th:href="@{/SubList(resort=${resort}, ID=${pid})}">Sub List</a>
                <a class="nav-btn" target="_self" th:href="@{/UpdateInfo(resort=${resort}, ID=${pid})}">My Info</a>
                <a class="nav-btn" target="_self" th:href="@{/MemberList(resort=${resort}, ID=${pid})}">Patrollers</a>
                <a class="nav-btn" target="_self" th:href="@{/Directors(resort=${resort}, ID=${pid})}">Directors</a>
                <!-- Member-only custom buttons sit here: after Directors, before Logout -->
                <a th:each="button : ${menu.memberButtons}" class="nav-btn"
                   th:href="${button.url}" th:text="${button.text}"
                   th:target="${button.url.startsWith('/') ? '_self' : '_blank'}">Button</a>
                <a th:if="${pid != null and pid != ''}" class="nav-btn nav-btn-logout"
                   target="_self" th:href="@{/MemberLogout(resort=${resort})}">Logout</a>
                <!-- Directors only, and set apart from Logout so it does not read as part of the
                     everyday menu. Asked of the service rather than threaded through every
                     controller, the same as the custom buttons above. -->
                <a th:if="${pid != null and pid != ''
                            and @headerViewerService.isDirector(resort, pid)}"
                   class="nav-btn nav-btn-new-features" target="_self"
                   th:href="@{/NewFeatures(resort=${resort}, ID=${pid})}">New Features</a>
            </div>
        </div>
    </div>

</body>
</html>
