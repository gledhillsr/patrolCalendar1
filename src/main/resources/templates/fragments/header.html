<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="header(resort, resortFullName, patrollerId)" th:with="pid=${patrollerId != null ? patrollerId : ''}">
        <div id="banner" style="padding: 0; line-height:3px; background-color:#F8F8F8; height: 110px; border-bottom: thick;">
            <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td>
                        <a th:href="${resortUrl}">
                            <img border="0" th:src="${resortImage}" th:height="${resortImgHeight}"/>
                        </a>
                    </td>
                    <td align="center">
                        <h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span th:text="${resortFullName}">Resort</span> Ski Patrol&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                            <img border="0" src="/calendar-1/images/cadeuc4.gif" width="32" height="33"/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        </h1>
                    </td>
                    <td align="right">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <p align="center">
                            <a th:href="@{/MonthCalendar(resort=${resort}, ID=${pid})}" target="_self">Online Schedule</a>
                            <a th:href="@{/ListAssignments(resort=${resort}, ID=${pid})}" target="_self">My Assignments</a>
                            <a th:href="@{/SubList(resort=${resort}, ID=${pid})}" target="_self">SubList</a>
                            <a th:href="@{/UpdateInfo(resort=${resort}, ID=${pid})}">My Info</a>
                            <a th:href="@{/MemberList(resort=${resort}, ID=${pid})}" target="_self">Patrollers</a>
                            <a th:href="@{/Directors(resort=${resort}, ID=${pid})}" target="_self">Directors</a>
                        </p>
                    </td>
                    <td>
                        <span th:text="${logoutLink}"></span>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
