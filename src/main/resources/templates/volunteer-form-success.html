<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted - Patrol Calendar</title>
    <th:block th:replace="~{fragments/head :: icons}"></th:block>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <!-- The site's message box, in place of the browser's alert() -->
    <script th:src="@{/js/dialogs.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header(resort=${resort}, resortFullName=${resortFullName}, patrollerId=${null})}"></div>

    <div class="content">
        <br><br><br><br><br><br>
        <h2>Submitting application... please wait</h2>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script type="text/javascript" th:inline="javascript">
        var timer = setTimeout(function() {
            //the navigation waits for the box to close: alert() blocked here, a dialog does not
            showMessageDialog("Application submitted", function () {
                window.location = /*[[${redirectUrl}]]*/ '';
            }, "Thank you");
        }, 2000);
    </script>
</body>
</html>
