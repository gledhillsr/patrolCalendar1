<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title th:text="'List of Members of the ' + ${resortFullName} + ' Ski Patrollers'">Member List</title>
    <th:block th:replace="~{fragments/head :: icons}"></th:block>
    <style type="text/css">
        body {
            font-size: 10pt;
            color: #000000;
            background-color: #ffffff;
        }
        /* One row: email button, the Pro/Alumni boxes, then the roster toggle. flex so the
           controls share a centre line whatever their natural heights, and wrap together
           rather than mid-group on a narrow window. */
        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin: 10px 0;
            font-weight: bold;
        }
        .toolbar-group {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }
        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            cursor: pointer;
        }
        /* Small round "?" beside the toggle; click for what trimming leaves out */
        .help-dot {
            display: inline-block;
            width: 15px;
            height: 15px;
            line-height: 15px;
            text-align: center;
            border-radius: 50%;
            border: 1px solid #003366;
            background-color: #ffffff;
            color: #003366;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            vertical-align: middle;
            user-select: none;
        }
    </style>
    <!-- The site's message box, in place of the browser's alert() -->
    <script th:src="@{/js/dialogs.js}"></script>
</head>
<body topmargin="0" leftmargin="0" style="background-image: url(/calendar-1/images/ncmnthbk.jpg)">
    <div th:replace="~{fragments/header :: header(resort=${resort}, resortFullName=${resortFullName}, patrollerId=${patrollerId})}"></div>

    <p><center><h2 th:text="'List of Members of the ' + ${resortFullName} + ' Ski Patrollers'">Member List</h2></center></p>

    <!-- Email button, and the trimmed/full roster toggle beside it -->
    <div class="toolbar">
        <input th:if="${showEmailButton}" type="button"
               value="email THESE patrollers"
               th:data-url="${emailFormUrl}"
               onclick="window.location=this.getAttribute('data-url')"/>

        <!-- Downloads exactly the rows and columns on screen: same selection string as the email
             button beside it, so the two cannot pick different people. -->
        <input type="button"
               value="Download to Excel"
               title="Download this list as a spreadsheet"
               th:data-url="${downloadRosterUrl}"
               onclick="window.location=this.getAttribute('data-url')"/>

        <!-- Opt-in classifications. A GET form so the choice lands in the URL and the page can be
             bookmarked or reloaded; each box reloads the list, which also rebuilds the email
             button's URL so it keeps offering exactly who is on screen.
             Hidden while the full roster is up - that already includes everyone. -->
        <form th:if="${!fullRoster}" method="get" th:action="@{/MemberList}" class="toolbar-group">
            <input type="hidden" name="resort" th:value="${resort}"/>
            <input type="hidden" name="ID" th:value="${patrollerId}"/>
            <!-- marks a request as having come through these boxes, so an unticked Pro is
                 distinguishable from a plain link that never had the boxes on it -->
            <input type="hidden" name="filters" value="1"/>
            <label><input type="checkbox" name="pro" value="true"
                          th:checked="${includePro}" onchange="this.form.submit()"/> Paid</label>
            <label><input type="checkbox" name="alumni" value="true"
                          th:checked="${includeAlumni}" onchange="this.form.submit()"/> Alumni</label>
        </form>

        <!-- The label says where the button goes, not where you are -->
        <span class="toolbar-group">
            <input type="button"
                   th:value="${fullRoster} ? 'Show Trimmed Roster' : 'Show FULL roster'"
                   th:data-url="${toggleRosterUrl}"
                   onclick="window.location=this.getAttribute('data-url')"/>
            <!-- Only alongside "Show Trimmed Roster", to say what trimming leaves out -->
            <span th:if="${fullRoster}" class="help-dot" title="What is a trimmed roster?"
                  onclick="showMessageDialog('Trimmed roster does not show Inactive or \'Other\' patrollers.\n\nPaid and Alumni are controlled by the boxes above.', null, 'What is a trimmed roster?');">?</span>
        </span>
    </div>

    <!-- Member table -->
    <table style="font-size: 10pt; font-family: Verdana, Arial, Helvetica;" border="1" width="100%" bordercolordark="#003366" bordercolorlight="#C0C0C0">
        <tr>
            <td width="160" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Name</font></font></td>
            <td width="55" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Class</font></font></td>
            <td width="70" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Commitment</font></font></td>
            <td width="90" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Home</font></font></td>
            <td width="83" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Work</font></font></td>
            <td width="70" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Cell</font></font></td>
            <td width="136" bgcolor="#C0C0C0"><font face="Verdana, Arial, Helvetica"><font size="2">Email</font></font></td>
        </tr>

        <!-- Empty state message -->
        <tr th:if="${members.isEmpty()}">
            <td colspan="5" style="text-align: center; padding: 20px;">
                No active members
            </td>
        </tr>

        <!-- Member rows -->
        <tr th:each="member : ${members}">
            <td th:text="${member.name}">Name</td>
            <td th:text="${member.classification}">Class</td>
            <td th:text="${member.commitment}">Commitment</td>
            <td th:text="${member.homePhone != null and member.homePhone != '' ? member.homePhone : ''}">Home</td>
            <td th:text="${member.workPhone != null and member.workPhone != '' ? member.workPhone : ''}">Work</td>
            <td th:text="${member.cellPhone != null and member.cellPhone != '' ? member.cellPhone : ''}">Cell</td>
            <td>
                <a th:if="${member.email != null and member.email != ''}"
                   th:href="'mailto:' + ${member.email}"
                   th:text="${member.email}">email</a>
            </td>
        </tr>
    </table>

    <!-- Member count -->
    <br>
    <b><span th:text="${memberCount} + ' members listed.'">0 members listed.</span></b>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
