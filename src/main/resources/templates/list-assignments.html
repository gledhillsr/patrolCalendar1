<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title th:text="${memberName} + '\'s Assignment Schedule for ' + ${resortFullName}">Assignment Schedule</title>
    <style type="text/css">
        body {
            font-size: 10pt;
            color: #000000;
            background-color: #ffffff;
        }
        /* Heads each season's block of shifts when all assignments are displayed */
        .season-separator {
            background-color: #003366;
            color: #ffffff;
            font-weight: bold;
            font-size: 11pt;
            padding: 4px 8px;
            letter-spacing: 0.04em;
        }
        /* Same width as the assignment table it stands in for, so the page does not jump */
        .no-shifts {
            width: 550px;
            max-width: 100%;
            border: 1px solid #808080;
            background-color: #ffffff;
            padding: 14px 12px;
            font-size: 12pt;
            font-weight: bold;
            color: #444444;
        }
    </style>
</head>
<body topmargin="0" leftmargin="0" style="background-image: url(/calendar-1/images/ncmnthbk.jpg)">
    <div th:replace="~{fragments/header :: header(resort=${resort}, resortFullName=${resortFullName}, patrollerId=${patrollerId})}"></div>

    <h1>
        <img border="0" src="/calendar-1/images/ski_accident_md_wht.gif" align="top">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Shift Summary
    </h1>

    <!-- Backdoor user message -->
    <div th:if="${isBackdoorUser}">
        Have a great day<br>
    </div>

    <!-- Main content for normal users -->
    <div th:unless="${isBackdoorUser}">
        <!-- Toggle link -->
        <p th:if="${displayAllAssignments}">
            Displaying all assignments.
            <a th:href="${toggleUrl}"><b th:text="${toggleText}">Toggle</b></a>
        </p>
        <p th:unless="${displayAllAssignments}">
            Displaying current season ONLY.
            <a th:href="${toggleUrl}"><b th:text="${toggleText}">Toggle</b></a>
        </p>

        <!-- Member name and resort -->
        <p>
            <font size="5" th:text="${memberName} + '\'s Assignment Schedule for ' + ${resortFullName}">Assignment Schedule</font>
        </p>

        <!-- Nothing to show: say so plainly rather than drawing a one-row empty table, which
             read as a broken page. Everything else round it stays put, the season toggle above
             especially - widening the range is the obvious next thing to try. -->
        <div th:if="${assignments.isEmpty()}" class="no-shifts">
            No shift assignments found for the selected date range
        </div>

        <!-- Assignment table -->
        <div align="left" th:unless="${assignments.isEmpty()}">
            <table border="1" width="550" bgcolor="#FFFFFF" cellpadding="0" cellspacing="0">
                <!-- Assignment rows, each season's headed by its own label. th:block so the
                     separator and the row are siblings rather than nested. -->
                <th:block th:each="assignment : ${assignments}">
                <tr th:if="${assignment.startsSeason}">
                    <td colspan="2" class="season-separator" th:text="${assignment.seasonLabel}">Season</td>
                </tr>
                <tr th:attr="bgcolor=${assignment.bgColor}">
                    <td th:if="${assignment.missedShift}" valign="middle" bgcolor="#80ffff" align="left">
                        &nbsp;<span th:text="${assignment.dateTimeRange}">Date</span> &lt;Shift Missed&gt;
                    </td>
                    <td th:unless="${assignment.missedShift}" valign="middle" align="left">
                        &nbsp;<span th:text="${assignment.dateTimeRange}">Date</span>
                    </td>
                    <td>
                        &nbsp;<span th:text="${assignment.shiftType}">Type</span>
                    </td>
                </tr>
                </th:block>
            </table>
        </div>

        <!-- Shift count totals -->
        <br><b>Totals</b>
        <span th:each="entry : ${shiftCounts}">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span th:text="${entry.key}">Shift Type</span> = <b th:text="${entry.value}">0</b>
        </span>
        <br><b>Total shifts</b>:&nbsp;&nbsp;&nbsp;<b th:text="${totalShifts}">0</b>

        <!-- Reached from the Directors page, so give the way back rather than relying on Back -->
        <p th:if="${cameFromDirectors}">
            <br>
            <input type="button" value="Done" th:data-url="${directorsUrl}"
                   onclick="window.location=this.dataset.url">
        </p>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
