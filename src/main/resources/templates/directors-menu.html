<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Database Maintenance - ' + ${resortFullName}">Database Maintenance</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #222; }

        #main { max-width: 820px; margin: 16px auto; padding: 0 16px; }

        h1 { font-size: 1.25em; font-weight: bold; color: #003366; margin-bottom: 16px;
             padding-bottom: 10px; border-bottom: 1px solid #d0d0d0; }

        .card { background: white; border-radius: 8px; border: 1px solid #d0d0d0;
                margin-bottom: 14px; overflow: hidden; }
        .card-hdr { display: flex; align-items: center; gap: 10px; padding: 11px 18px;
                    font-weight: bold; font-size: 1em; border-bottom: 1px solid #d0d0d0; }
        .card-hdr .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .card-body { padding: 16px 18px; }

        /* Teal — Patroller Maintenance */
        .card-teal { border-left: 4px solid #0d9488; }
        .card-teal .card-hdr { background: #f0fdfa; color: #0f766e; border-bottom-color: #99f6e4; }
        .card-teal .dot { background: #0d9488; }

        /* Violet — Patrol Listings */
        .card-violet { border-left: 4px solid #7c3aed; }
        .card-violet .card-hdr { background: #f5f3ff; color: #5b21b6; border-bottom-color: #ddd6fe; }
        .card-violet .dot { background: #7c3aed; }

        /* Orange — Setup / Cleanup */
        .card-orange { border-left: 4px solid #ea580c; }
        .card-orange .card-hdr { background: #fff7ed; color: #9a3412; border-bottom-color: #fed7aa; }
        .card-orange .dot { background: #ea580c; }

        /* Buttons */
        .btn { display: inline-block; padding: 5px 14px; border-radius: 4px; font-size: 0.82em;
               font-weight: bold; cursor: pointer; border: 1px solid #aaa; background: white;
               color: #003366; margin: 3px 2px; vertical-align: middle; }
        .btn:hover { background: #003366; color: white; border-color: #003366; }
        .btn-red { border-color: #fca5a5; color: #b91c1c; }
        .btn-red:hover { background: #b91c1c; color: white; border-color: #b91c1c; }

        /* Patroller section */
        .patroller-row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 10px; }
        .patroller-actions { display: flex; flex-direction: column; gap: 5px; min-width: 190px; }
        .patroller-actions .btn { width: 100%; text-align: left; }
        .hint { font-size: 0.75em; color: #666; margin-bottom: 4px; }

        /* Listings section */
        .listings-cols { display: flex; gap: 36px; flex-wrap: wrap; }
        .sub-label { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em;
                     color: #666; font-weight: bold; margin-bottom: 8px; }
        .listings-col { display: flex; flex-direction: column; gap: 4px; }

        /* Setup section */
        .setup-list { display: flex; flex-direction: column; gap: 5px; }

        /* Non-director notice */
        .not-authorized { background: #fff8e1; border: 1px solid #f9c84e; border-radius: 6px;
                          padding: 16px 20px; margin-bottom: 16px; display: flex;
                          align-items: center; gap: 12px; }
    </style>
</head>
<body topmargin="0" leftmargin="0" style="background-image: url(/calendar-1/images/ncmnthbk.jpg)">
    <div th:replace="~{fragments/header :: header(resort=${resort}, resortFullName=${resortFullName}, patrollerId=${patrollerId})}"></div>

    <div id="main">
        <h1 th:text="'Database Maintenance — ' + ${resortFullName}">Database Maintenance</h1>

        <!-- Non-Director View -->
        <div th:if="${!isDirector}">
            <div class="not-authorized">
                <img th:src="@{/images/EvilSmile.gif}" width="32" height="32" alt="">
                <span>Sorry, you are not authorized for this menu. Try becoming a director next year.</span>
            </div>
            <input class="btn" type="button" value="Customized Listing ..."
                   th:data-url="|SetupListPatrollers?resort=${resort}&ID=${patrollerId}|"
                   onclick="window.location=this.dataset.url">
        </div>

        <!-- Director View -->
        <div th:if="${isDirector}">
            <form target="_self" action="UpdateInfo" method="POST" id="form02" name="form02">
                <input type="hidden" name="resort" th:value="${resort}">
                <input type="hidden" name="ID" th:value="${patrollerId}">

                <!-- 1. Patroller Maintenance -->
                <div class="card card-teal">
                    <div class="card-hdr">
                        <span class="dot"></span>Patroller Maintenance
                    </div>
                    <div class="card-body">
                        <input class="btn" type="button" value="Add New Patroller ..."
                               th:data-url="|UpdateInfo?resort=${resort}&Purpose=Add_Patroller&ID=${patrollerId}|"
                               onclick="window.location=this.dataset.url">
                        <div class="patroller-row">
                            <div class="patroller-actions">
                                <span class="hint">Select a patroller on the right, then:</span>
                                <input class="btn" type="submit" name="setNewID"    value="Change ID Number ...">
                                <input class="btn" type="submit" name="EditInfo"    value="Edit Patroller Info ...">
                                <input class="btn btn-red" type="submit" name="removeName" value="Delete Patroller ...">
                            </div>
                            <div>
                                <select name="NameToEdit" size="8" style="min-width:190px;">
                                    <option th:each="name : ${sortedRoster}"
                                            th:value="${name}"
                                            th:text="${name}"
                                            th:selected="${name == myName}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Patrol Listings -->
                <div class="card card-violet">
                    <div class="card-hdr">
                        <span class="dot"></span>Patrol Listings
                    </div>
                    <div class="card-body">
                        <div class="listings-cols">
                            <div>
                                <div class="sub-label">Custom Reports</div>
                                <div class="listings-col">
                                    <input class="btn" type="button" value="Customized Listing ..."
                                           th:data-url="|SetupListPatrollers?resort=${resort}&ID=${patrollerId}|"
                                           onclick="window.location=this.dataset.url">
                                </div>
                            </div>
                            <div>
                                <div class="sub-label">Quick Reports</div>
                                <div class="listings-col">
                                    <input class="btn" type="button" value="Sorted by Day Shifts"
                                           th:data-url="|ListPatrollers?resort=${resort}&NAME=LAST&AUX=1&BAS=1&SR=1&SRA=1&TRA=1&CAN=1&PRO=1&ALM=1&INA=1&FullTime=1&PartTime=1&Inactive=1&FIRST=1&DAY_CNT=1&DAY_DETAILS=1&ALL=1&FirstSort=shiftCnt&SecondSort=None&ThirdSort=None&FontSize=12&ID=${patrollerId}|"
                                           onclick="window.location=this.dataset.url">
                                    <input class="btn" type="button" value="Sorted by Swing Shifts"
                                           th:data-url="|ListPatrollers?resort=${resort}&NAME=LAST&AUX=1&BAS=1&SR=1&SRA=1&TRA=1&CAN=1&PRO=1&ALM=1&INA=1&FullTime=1&PartTime=1&Inactive=1&FIRST=1&SWING_CNT=1&SWING_DETAILS=1&ALL=1&FirstSort=shiftCnt&SecondSort=None&ThirdSort=None&FontSize=12&ID=${patrollerId}|"
                                           onclick="window.location=this.dataset.url">
                                    <input class="btn" type="button" value="Sorted by Night Shifts"
                                           th:data-url="|ListPatrollers?resort=${resort}&NAME=LAST&AUX=1&BAS=1&SR=1&SRA=1&TRA=1&CAN=1&PRO=1&ALM=1&INA=1&FullTime=1&PartTime=1&Inactive=1&FIRST=1&NIGHT_CNT=1&NIGHT_DETAILS=1&ALL=1&FirstSort=shiftCnt&SecondSort=None&ThirdSort=None&FontSize=12&ID=${patrollerId}|"
                                           onclick="window.location=this.dataset.url">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Patrol Setup / Cleanup -->
                <div class="card card-orange">
                    <div class="card-hdr">
                        <span class="dot"></span>Patrol Setup / Cleanup
                    </div>
                    <div class="card-body">
                        <div class="setup-list">
                            <div>
                                <input class="btn" type="button" value="Web Site Preferences ..."
                                       th:data-url="|WebSitePreferences?resort=${resort}&ID=${patrollerId}|"
                                       onclick="window.location=this.dataset.url">
                            </div>
                            <div>
                                <input class="btn" type="button" value="Edit Shift Templates (for Calendar) ..."
                                       th:data-url="|EditShiftTemplates?resort=${resort}&ID=${patrollerId}|"
                                       onclick="window.location=this.dataset.url">
                            </div>
                            <div>
                                <input class="btn btn-red" type="button" value="Delete assignments from last season ..."
                                       th:data-url="|PurgeAssignments?resort=${resort}&ID=${patrollerId}|"
                                       onclick="window.location=this.dataset.url">
                            </div>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
