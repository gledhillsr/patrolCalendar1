<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="-1">
    <title th:text="${resortFullName} + ' Password Reset'">Password Reset</title>
    <style type="text/css">
        body {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 10pt;
            color: #000000;
            background-color: #ffffff;
        }
        h2 {
            font-size: 14pt;
            font-weight: bold;
        }
        table {
            border-collapse: collapse;
            width: 450px;
            background-color: #EFEFEF;
            margin: 20px auto;
        }
        td {
            padding: 8px;
            font-size: 10pt;
        }
        .label-col {
            text-align: right;
            width: 200px;
            font-weight: bold;
        }
        .input-col {
            width: 250px;
        }
        input[type="password"] {
            width: 200px;
            padding: 4px;
        }
        input[type="submit"] {
            padding: 6px 12px;
            margin-top: 10px;
        }
        .error {
            color: red;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }
        .instructions {
            margin: 20px 0;
            text-align: center;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <!-- Reuse header fragment -->
    <div th:replace="~{fragments/header :: header(${resort})}"></div>

    <!-- Page title -->
    <p><h2 th:text="${resortFullName} + ' Password Reset'">Password Reset</h2></p>

    <!-- Instructions -->
    <div class="instructions">
        <p>Enter your new password below. Your password will be updated immediately.</p>
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <!-- Reset form -->
    <form method="post" th:action="@{/ResetPassword}">
        <input type="hidden" name="resort" th:value="${resort}"/>
        <input type="hidden" name="token" th:value="${token}"/>

        <table>
            <tr>
                <td class="label-col">New Password:</td>
                <td class="input-col">
                    <input type="password" name="newPassword" id="newPassword" required/>
                </td>
            </tr>
            <tr>
                <td class="label-col">Confirm Password:</td>
                <td class="input-col">
                    <input type="password" name="confirmPassword" id="confirmPassword" required/>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Reset Password"/>
                </td>
            </tr>
        </table>
    </form>

    <!-- Reuse footer fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
