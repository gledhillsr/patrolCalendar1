# Server configuration
server.port=8080
server.address=127.0.0.1
server.servlet.context-path=/calendar-1
server.forward-headers-strategy=native

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.org.nsponline.calendar=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.coyote.http11.Http11Processor=WARN

# Email configuration
# SMTP host can be overridden in credentials.properties or via environment variable
smtp.host=localhost
