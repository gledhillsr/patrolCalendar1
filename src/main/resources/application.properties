# Server configuration
server.port=8080
server.address=127.0.0.1
server.servlet.context-path=/calendar-1
server.forward-headers-strategy=native

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.org.nsponline.calendar=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.coyote.http11.Http11Processor=WARN

# Email configuration
# SMTP host can be overridden in credentials.properties or via environment variable
smtp.host=localhost

# Email attachments. EmailForm enforces a 2MB total itself so it can show a friendly
# error; these limits are the backstop that stops an abusive upload being buffered.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# EmailForm posts one multipart part - and one request parameter - per selected recipient, so a
# bulk email to the whole roster blows Tomcat 11's defaults (50 parts, 1000 parameters) and is
# rejected with a bare 413 before any controller runs. Raising the count is not a memory hole:
# max-http-form-post-size still caps the non-file part data at 2MB.
server.tomcat.max-part-count=2000
server.tomcat.max-parameter-count=4000

# Static assets are served under a URL containing a hash of their content, so a changed file gets a
# new URL and a browser cannot serve a stale copy of it. This is not a nicety: shiftTime.js gained
# the End Time check while browsers were already holding the earlier copy, so onblur called a
# function that was not there, the submit check let it through, and the only thing that noticed was
# the server. Thymeleaf's @{/js/...} links are rewritten to the hashed URL automatically.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/js/**,/css/**
